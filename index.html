<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121f">
<meta name="description" content="Private, local-first personal budgeting for Kenya"><title>SaveCoin</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/app.css">
</head><body><div id="app" class="app-shell">
<aside class="sidebar"><a class="brand" href="#dashboard" aria-label="SaveCoin home"><span class="brand-mark">S</span><span><strong>SaveCoin</strong><small>Build with intention</small></span></a>
<nav id="nav" aria-label="Primary"><button data-view="dashboard">Overview</button><button data-view="money">Money</button><button data-view="budget">Budget</button><button data-view="goals">Goals</button><button data-view="reviews">Reviews</button><button data-view="settings">Settings</button></nav>
<div class="privacy-chip">Local-only · No tracking</div></aside>
<main><header class="topbar"><div><p class="eyebrow" id="today"></p><h1 id="view-title">Overview</h1></div><div class="top-actions"><button class="icon-btn" id="hide-btn" title="Hide balances">◉</button><button class="primary" data-action="add-transaction">＋ Add transaction</button></div></header>
<div id="update-banner" class="banner hidden">An update is available. <button id="update-btn">Refresh</button></div>
<section id="content" aria-live="polite"></section></main>
<nav class="bottom-nav" aria-label="Mobile navigation"><button data-view="dashboard">Home</button><button data-view="money">Money</button><button class="add" data-action="add-transaction">＋</button><button data-view="goals">Goals</button><button data-view="settings">More</button></nav>
</div><dialog id="modal"><form method="dialog"><button class="dialog-close" value="cancel" aria-label="Close">×</button><div id="modal-content"></div></form></dialog><div id="toast" role="status"></div>
<script type="module" src="./js/app.js"></script></body></html>
